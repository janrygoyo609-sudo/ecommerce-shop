<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - E-Commerce Shop</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h2 class="text-center mb-4">Admin Portal</h2>

  <div class="row justify-content-center">
    <div class="col-md-5">

      <!-- Admin Sign Up -->
      <div class="card mb-3">
        <div class="card-header">Admin Sign Up</div>
        <div class="card-body">
          <input class="form-control mb-2" id="adminSignupUser" placeholder="Username">
          <input type="password" class="form-control mb-2" id="adminSignupPass" placeholder="Password">
          <button class="btn btn-success w-100" onclick="adminSignup()">Sign Up</button>
        </div>
      </div>

      <!-- Admin Login -->
      <div class="card">
        <div class="card-header">Admin Login</div>
        <div class="card-body">
          <input class="form-control mb-2" id="adminLoginUser" placeholder="Username">
          <input type="password" class="form-control mb-2" id="adminLoginPass" placeholder="Password">
          <button class="btn btn-primary w-100" onclick="adminLogin()">Log In</button>
        </div>
      </div>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="admin.js"></script>

</body>
</html>
