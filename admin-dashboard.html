<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Product Management</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-danger">
  <div class="container d-flex justify-content-between">
    <span class="navbar-brand mb-0 h1">Admin Dashboard</span>
    <button class="btn btn-outline-light" onclick="logoutAdmin()">Logout</button>
  </div>
</nav>

<div class="container mt-4">

  <h3>Products Management</h3>
  
  <!-- Add Product Form -->
  <div class="card mb-3 p-3">
    <h5>Add / Update Product</h5>
    <input type="text" id="productName" class="form-control mb-2" placeholder="Product Name">
    <input type="number" id="productPrice" class="form-control mb-2" placeholder="Price">
    <input type="text" id="productImg" class="form-control mb-2" placeholder="Image File Name (e.g., product.png)">
    <button class="btn btn-success w-100" onclick="saveProduct()">Save Product</button>
  </div>

  <!-- Products Table -->
  <div class="card p-3">
    <h5>All Products</h5>
    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>Name</th>
          <th>Price</th>
          <th>Image</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="productsTable"></tbody>
    </table>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Check if admin is logged in
if(!localStorage.getItem('loggedInAdmin')){
  alert("Please log in as admin");
  window.location.href = "admin-login.html";
}

// Logout
function logoutAdmin(){
  localStorage.removeItem('loggedInAdmin');
  window.location.href = "admin-login.html";
}

// Load Products
function loadProducts(){
  const products = JSON.parse(localStorage.getItem('products') || '[]');
  const tbody = document.getElementById('productsTable');
  tbody.innerHTML = '';
  products.forEach((p, index) => {
    tbody.innerHTML += `
      <tr>
        <td>${p.name}</td>
        <td>₱${p.price}</td>
        <td><img src="images/${p.img}" style="max-height:50px;"></td>
        <td>
          <button class="btn btn-sm btn-primary me-1" onclick="editProduct(${index})">Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deleteProduct(${index})">Delete</button>
        </td>
      </tr>
    `;
  });
}

// Save / Add Product
function saveProduct(){
  const name = document.getElementById('productName').value.trim();
  const price = Number(document.getElementById('productPrice').value);
  const img = document.getElementById('productImg').value.trim();

  if(!name || !price || !img){ alert("Fill all fields"); return; }

  let products = JSON.parse(localStorage.getItem('products') || '[]');

  if(window.editIndex != undefined){
    // Update existing product
    products[window.editIndex] = {name, price, img};
    window.editIndex = undefined;
  } else {
    // Add new product
    products.push({name, price, img});
  }

  localStorage.setItem('products', JSON.stringify(products));
  document.getElementById('productName').value = '';
  document.getElementById('productPrice').value = '';
  document.getElementById('productImg').value = '';
  loadProducts();
}

// Edit Product
function editProduct(index){
  const products = JSON.parse(localStorage.getItem('products') || '[]');
  const p = products[index];
  document.getElementById('productName').value = p.name;
  document.getElementById('productPrice').value = p.price;
  document.getElementById('productImg').value = p.img;
  window.editIndex = index; // mark editing
}

// Delete Product
function deleteProduct(index){
  if(!confirm("Are you sure you want to delete this product?")) return;
  let products = JSON.parse(localStorage.getItem('products') || '[]');
  products.splice(index, 1);
  localStorage.setItem('products', JSON.stringify(products));
  loadProducts();
}

// Initialize
loadProducts();
</script>
</body>
</html>
