<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All-in-One E-Commerce Shop</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar with Sign Up / Log In -->
<nav class="navbar navbar-dark bg-danger">
  <div class="container d-flex justify-content-between">
    <span class="navbar-brand mb-0 h1">🛒 My Online Shop</span>
    <div>
      <button class="btn btn-outline-light me-2" data-bs-toggle="modal" data-bs-target="#signupModal">Sign Up</button>
      <button class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#loginModal">Log In</button>
    </div>
  </div>
</nav>

<div class="container mt-4">

  <!-- Products -->
  <h3 class="mb-3">🔥 Products</h3>
  <div class="row g-3">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h5 class="card-title">Physical Product</h5>
          <p class="text-danger fw-bold">₱299</p>
          <button class="btn btn-danger w-100" onclick="addToCart('Physical Product', 299)">Add to Cart</button>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h5 class="card-title">Digital Product</h5>
          <p class="text-danger fw-bold">₱150</p>
          <button class="btn btn-danger w-100" onclick="addToCart('Digital Product', 150)">Add to Cart</button>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h5 class="card-title">Service</h5>
          <p class="text-danger fw-bold">₱500</p>
          <button class="btn btn-danger w-100" onclick="addToCart('Service', 500)">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Cart -->
  <div class="card mt-4 shadow-sm">
    <div class="card-body">
      <h4>🛒 Cart</h4>
      <div id="cart"></div>
      <p class="fw-bold">Total: ₱<span id="total">0</span></p>
    </div>
  </div>

  <!-- Checkout -->
  <div class="card mt-3 shadow-sm">
    <div class="card-body">
      <h4>🧾 Checkout</h4>
      <form onsubmit="sendOrder(event)">
        <input class="form-control mb-2" placeholder="Full Name" required>
        <input class="form-control mb-2" placeholder="Address / Email" required>
        <button class="btn btn-success w-100">Place Order</button>
      </form>
      <p class="mt-3">
        💸 <strong>GCash:</strong> 09XXXXXXXXX <br>
        💸 <strong>Maya:</strong> 09XXXXXXXXX <br>
        Send payment screenshot after checkout
      </p>
    </div>
  </div>

</div>

<!-- Sign Up Modal -->
<div class="modal fade" id="signupModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Sign Up</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input class="form-control mb-2" id="signupUser" placeholder="Username">
        <input type="password" class="form-control mb-2" id="signupPass" placeholder="Password">
        <button class="btn btn-success w-100" onclick="signup()">Sign Up</button>
      </div>
    </div>
  </div>
</div>

<!-- Login Modal -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Log In</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input class="form-control mb-2" id="loginUser" placeholder="Username">
        <input type="password" class="form-control mb-2" id="loginPass" placeholder="Password">
        <button class="btn btn-success w-100" onclick="login()">Log In</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- All-in-One JS -->
<script>
let cart = [];
let total = 0;

// Sign Up / Login
function signup() {
  const user = document.getElementById('signupUser').value;
  const pass = document.getElementById('signupPass').value;
  if(!user || !pass) { alert('Please fill all fields'); return; }
  if(localStorage.getItem(user)) {
    alert('Username already exists!');
  } else {
    localStorage.setItem(user, pass);
    alert('Sign Up successful! You can now Log In.');
    document.getElementById('signupUser').value = '';
    document.getElementById('signupPass').value = '';
    var modalEl = document.getElementById('signupModal');
    var modal = bootstrap.Modal.getInstance(modalEl);
    modal.hide();
  }
}

function login() {
  const user = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  const storedPass = localStorage.getItem(user);
  if(storedPass === null) {
    alert('Username does not exist!');
  } else if(storedPass === pass) {
    alert('Logged in successfully!');
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
    var modalEl = document.getElementById('loginModal');
    var modal = bootstrap.Modal.getInstance(modalEl);
    modal.hide();
  } else {
    alert('Incorrect password!');
  }
}

// Cart functions
function addToCart(name, price) {
  cart.push({ name, price });
  total += price;
  displayCart();
}

function displayCart() {
  let cartDiv = document.getElementById("cart");
  cartDiv.innerHTML = "";
  cart.forEach(item => {
    cartDiv.innerHTML += `<p>${item.name} - ₱${item.price}</p>`;
  });
  document.getElementById("total").innerText = total;
}

function sendOrder(e) {
  e.preventDefault();
  alert("Order received!\nTotal: ₱" + total + "\nPlease pay via GCash/Maya and send screenshot.");
}
</script>

</body>
</html>
