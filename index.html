<header>
  🛒 My Online Shop
</header>

<div class="container">

  <h2>🔥 Products</h2>

  <div class="products">
    <div class="product">
      <h3>Physical Product</h3>
      <p class="price">₱299</p>
      <button onclick="addToCart('Physical Product', 299)">Add to Cart</button>
    </div>

    <div class="product">
      <h3>Digital Product</h3>
      <p class="price">₱150</p>
      <button onclick="addToCart('Digital Product', 150)">Add to Cart</button>
    </div>

    <div class="product">
      <h3>Service</h3>
      <p class="price">₱500</p>
      <button onclick="addToCart('Service', 500)">Add to Cart</button>
    </div>
  </div>

  <div class="cart-box">
    <h2>🛒 Cart</h2>
    <div id="cart"></div>
    <p><strong>Total: ₱<span id="total">0</span></strong></p>
  </div>

  <div class="cart-box">
    <h2>🧾 Checkout</h2>
    <form onsubmit="sendOrder(event)">
      <input type="text" placeholder="Full Name" required>
      <input type="text" placeholder="Address / Email" required>
      <button type="submit">Place Order</button>
    </form>

    <p>
      💸 <strong>GCash:</strong> 09XXXXXXXXX <br>
      💸 <strong>Maya:</strong> 09XXXXXXXXX <br>
      Send payment screenshot after checkout
    </p>
  </div>

</div>
