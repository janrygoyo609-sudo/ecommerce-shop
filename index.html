<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My ECOMERCES Shop</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-danger">
  <div class="container">
    <span class="navbar-brand mb-0 h1">🛒 My Online Shop</span>
  </div>
</nav>

<div class="container mt-4">

  <h3 class="mb-3">🔥 Products</h3>

  <div class="row g-3">

    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h5 class="card-title">Physical Product</h5>
          <p class="text-danger fw-bold">₱299</p>
          <button class="btn btn-danger w-100"
            onclick="addToCart('Physical Product', 299)">
            Add to Cart
          </button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h5 class="card-title">Digital Product</h5>
          <p class="text-danger fw-bold">₱150</p>
          <button class="btn btn-danger w-100"
            onclick="addToCart('Digital Product', 150)">
            Add to Cart
          </button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h5 class="card-title">Service</h5>
          <p class="text-danger fw-bold">₱500</p>
          <button class="btn btn-danger w-100"
            onclick="addToCart('Service', 500)">
            Add to Cart
          </button>
        </div>
      </div>
    </div>

  </div>

  <div class="card mt-4 shadow-sm">
    <div class="card-body">
      <h4>🛒 Cart</h4>
      <div id="cart"></div>
      <p class="fw-bold">Total: ₱<span id="total">0</span></p>
    </div>
  </div>

  <div class="card mt-3 shadow-sm">
    <div class="card-body">
      <h4>🧾 Checkout</h4>

      <form onsubmit="sendOrder(event)">
        <input class="form-control mb-2" placeholder="Full Name" required>
        <input class="form-control mb-2" placeholder="Address / Email" required>
        <button class="btn btn-success w-100">Place Order</button>
      </form>

      <p class="mt-3">
        💸 <strong>GCash:</strong> 09XXXXXXXXX <br>
        💸 <strong>Maya:</strong> 09XXXXXXXXX <br>
        Send payment screenshot after checkout
      </p>
    </div>
  </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
